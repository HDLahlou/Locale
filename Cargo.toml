[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/host-core",
  "crates/client-core",
  "crates/image-worker",
  "crates/mobile-bridge",
  "crates/harness",
  "apps/service",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false }
base64 = "0.23"
fs4 = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-image-io = { version = "0.3", default-features = false }
percent-encoding = "2.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false }
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
