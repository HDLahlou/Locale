[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/host-core",
  "crates/client-core",
  "crates/image-worker",
  "crates/mobile-bridge",
  "crates/harness",
  "apps/service",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
base64 = "0.23"
percent-encoding = "2.3"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
