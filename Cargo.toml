[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/host-core",
  "crates/client-core",
  "crates/image-worker",
  "crates/mobile-bridge",
  "crates/harness",
  "apps/service",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
