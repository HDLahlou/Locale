<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locale · Photo viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5}a:hover{color:#3730A3}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0 0 auto 0; height: 470px; background: {{scene}}"></div>
  <div style="position: absolute; inset: 0 0 auto 0; height: 140px; background: linear-gradient(180deg, rgba(14,15,17,0.7), rgba(14,15,17,0))"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 6px; padding: 44px 10px 8px">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #A5B4FC; color: #1E1B4B; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">J</span>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 600">Jordan</span>
        <span style="font-size: 12px; color: #D4D4D8">Fri 9:41 PM · 7 of 48</span>
      </span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; align-items: flex-end; padding: 0 16px 14px">
    <div style="display: flex; gap: 6px">
      <span style="padding: 3px 8px; border-radius: 6px; background: rgba(14,15,17,0.65); font-size: 11px; font-weight: 700; letter-spacing: 0.04em">{{formatLabel}}</span>
      <span style="padding: 3px 8px; border-radius: 6px; background: rgba(14,15,17,0.65); font-size: 11px; font-weight: 700">12 MP</span>
      <sc-if value="{{isHeic}}" hint-placeholder-val="{{true}}">
        <span style="padding: 3px 8px; border-radius: 6px; background: rgba(14,15,17,0.65); font-size: 11px; font-weight: 700">HDR</span>
      </sc-if>
      <span style="padding: 3px 8px; border-radius: 6px; background: rgba(14,15,17,0.65); font-size: 11px; font-weight: 700">Saved by 12</span>
    </div>
  </div>

  <div style="position: relative; background: #FFFFFF; color: #16171A; border-radius: 22px 22px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #D4D4D8; align-self: center"></div>
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Save photo</h2>

    <sc-if value="{{isHeic}}" hint-placeholder-val="{{true}}">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Version to save</legend>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 2px solid #6366F1; background: #F5F6FF; border-radius: 14px; cursor: pointer">
          <input type="radio" name="ver" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #6366F1">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 700">Original · HEIC <span style="font-weight: 600; font-size: 12px; color: #3730A3; margin-left: 4px">Best for this phone</span></span>
            <span style="font-size: 13px; line-height: 1.4; color: #4A4E55">The exact file Jordan shared, with HDR · 3.4 MB</span>
          </span>
        </label>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid #D4D4D8; border-radius: 14px; cursor: pointer">
          <input type="radio" name="ver" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #6366F1">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 700">Compatible · JPEG</span>
            <span style="font-size: 13px; line-height: 1.4; color: #4A4E55">Opens in any app. Slightly lower quality, no HDR · 5.1 MB</span>
          </span>
        </label>
      </fieldset>
    </sc-if>
    <sc-if value="{{isJpeg}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 2px solid #6366F1; background: #F5F6FF; border-radius: 14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 1px"><path d="M20 6L9 17l-5-5"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 700">Original · JPEG</span>
          <span style="font-size: 13px; line-height: 1.4; color: #4A4E55">The exact file Jordan shared. Opens everywhere · 4.2 MB</span>
        </span>
      </div>
    </sc-if>

    <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #A5B4FC; color: #1E1B4B; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>
      Save to Photos
    </button>
    <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5B5F66; text-align: center">Saved photos stay after the event ends. Everything else is deleted.</p>

    <div style="border-top: 1px solid #EFEDE8; padding-top: 10px; display: flex; justify-content: center">
      <button type="button" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #B42318; font-size: 14px; font-weight: 600; cursor: pointer">Delete this photo</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"format":{"editor":"enum","options":["HEIC","JPEG"],"default":"HEIC"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const f = this.props.format ?? 'HEIC';
    return {
      isHeic: f === 'HEIC', isJpeg: f === 'JPEG', formatLabel: f,
      scene: 'linear-gradient(180deg,#2E3168 0%,#6E4C8A 38%,#E79B7A 62%,#3B2A33 63%,#1C1620 100%)'
    };
  }
}
</script>
</body>
</html>
