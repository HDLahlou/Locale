    </sc-for>
    <div style="position: absolute; left: 190px; top: 214px; display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(30,27,75,0.16); font-size: 12px; font-weight: 700; color: #1E1B4B">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #A5B4FC; display: flex; align-items: center; justify-content: center">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"></path></svg>
      </span>
      Original · 3.4 MB
    </div>
  </div>

  <h1 style="position: relative; z-index: 1; margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.12; letter-spacing: -0.02em">Share full-quality photos with the people around you.</h1>
  <p style="position: relative; z-index: 1; margin: 0 0 22px; font-size: 16px; line-height: 1.5; color: #4A4E55">Photos stay on devices at the event, not in the cloud. Everything is deleted when the event ends.</p>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #A5B4FC; color: #1E1B4B; font-size: 16px; font-weight: 600; cursor: pointer">Sign up</button>
    <button type="button" style="height: 52px; border: 1.5px solid #16171A; border-radius: 14px; background: transparent; color: #16171A; font-size: 16px; font-weight: 600; cursor: pointer">Sign in</button>
    <button type="button" style="height: 48px; border: 0; background: transparent; color: #16171A; font-size: 16px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Continue as guest</button>
  </div>
  <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: #5B5F66; text-align: center">Guests can view and download. Uploading and hosting need a verified account.</p>
</div>
</x-dc>
